server.port=8081
spring.application.name=kisan-user

# Eureka Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Database Configuration (Kisan User DB)
# Credentials are loaded from environment variables (see .env.example).
# The application will fail to start if DB_USERNAME or DB_PASSWORD are not set.
spring.datasource.url=jdbc:mariadb://localhost:3306/kisan_user?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

#JPA & HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret (REQUIRED - no default for security reasons)
# Must be set via environment variable JWT_SECRET (see .env.example).
# The value MUST be identical for kisan-user and kisan-gateway.
# The application will fail to start (with a clear error) if JWT_SECRET is not provided.
jwt.secret=${JWT_SECRET}

