server.port=8082
spring.application.name=kisan-marketplace

# Logging configuration
#logging.level.root=INFO
#logging.level.com.kisan.marketplace=INFO
#logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Database Configuration (Isolated Marketplace DB)
# Credentials are loaded from environment variables (see .env.example).
# The application will fail to start if DB_USERNAME or DB_PASSWORD are not set.
spring.datasource.url=jdbc:mariadb://localhost:3306/kisan_marketplace?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Eureka Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/