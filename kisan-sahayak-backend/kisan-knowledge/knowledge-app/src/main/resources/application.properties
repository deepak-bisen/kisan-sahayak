server.port=8083
spring.application.name=kisan-knowledge

# Database Configuration (Isolated Knowledge Hub DB)
# Credentials are loaded from environment variables (see .env.example).
# The application will fail to start if DB_USERNAME or DB_PASSWORD are not set.
spring.datasource.url=jdbc:mariadb://localhost:3306/knowledge_kisan?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/