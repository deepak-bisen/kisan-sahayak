<div class="knowledge container">
  <div class="marketplace__head">
    <h1>Knowledge Hub</h1>
    <p class="field-hint">Learn about crops, seasons, soil types, and best farming practices.</p>
  </div>

  <div class="search-bar">
    <div class="search-bar__field search-bar__query">
      <input
        type="search"
        placeholder="Search by crop name…"
        [(ngModel)]="searchQuery"
        (ngModelChange)="load()"
      />
    </div>
    <div class="search-bar__field">
      <select [(ngModel)]="selectedSeason" (ngModelChange)="load()">
        <option value="">All seasons</option>
        <option *ngFor="let s of seasons" [value]="s">{{ s }}</option>
      </select>
    </div>
  </div>

  <div *ngIf="loading()" class="guide-list">
    <div class="skeleton-card" *ngFor="let _ of [1,2,3]">
      <div class="skeleton-line skeleton-line--h3"></div>
      <div class="skeleton-line skeleton-line--short"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line"></div>
    </div>
  </div>

  <div *ngIf="!loading() && guides().length === 0" class="empty-state">
    <p>No crop guides found.</p>
  </div>

  <div *ngIf="!loading() && guides().length" class="guide-list">
    <div *ngFor="let g of guides()" class="guide-card">
      <div *ngIf="g.imageUrl" class="guide-media">
        <img [src]="svc.resolveUrl(g.imageUrl)" alt="{{ g.cropName }}" />
      </div>
      <h3>{{ g.cropName }}</h3>
      <p class="meta">
        {{ g.season }} · {{ g.soilType }} · {{ g.durationInDays }} days
      </p>
      <div class="guide-section">
        <strong>Best Practices</strong>
        <p>{{ g.bestPractices }}</p>
      </div>
      <div *ngIf="g.diseaseManagement" class="guide-section">
        <strong>Disease Management</strong>
        <p>{{ g.diseaseManagement }}</p>
      </div>
      <div *ngIf="g.videoUrl" class="guide-section">
        <strong>Video</strong>
        <div class="guide-video">
          <video [src]="svc.resolveUrl(g.videoUrl)" controls class="guide-video__player"></video>
        </div>
      </div>
    </div>
  </div>
</div>
