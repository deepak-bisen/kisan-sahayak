<div class="auth-page">
  <div class="auth-card">
    <p class="eyebrow">प्रोफ़ाइल</p>
    <h1>Edit Profile</h1>

    @if (success()) {
      <div class="form-banner success">{{ success() }}</div>
    }
    @if (serverError()) {
      <div class="form-banner error">{{ serverError() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" formControlName="fullName" [class.invalid]="f.fullName.invalid && f.fullName.touched" />
      </div>

      <div class="auth-card__row">
        <div class="field">
          <label for="villageName">Village</label>
          <input id="villageName" formControlName="villageName" />
        </div>
        <div class="field">
          <label for="district">District</label>
          <input id="district" formControlName="district" />
        </div>
      </div>

      <div class="field">
        <label for="state">State</label>
        <input id="state" formControlName="state" />
      </div>

      <div class="field">
        <label for="password">New password (leave blank to keep current)</label>
        <input id="password" type="password" formControlName="password" placeholder="At least 6 characters" />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        {{ loading() ? 'Saving…' : 'Save changes' }}
      </button>
    </form>

    <hr style="margin:32px 0; border:none; border-top:1px solid var(--color-border);" />

    <div style="text-align:center;">
      <button class="btn btn-ghost" style="color:var(--color-clay);border-color:var(--color-clay);" (click)="confirmDelete.set(true)">
        Delete account
      </button>
    </div>
  </div>
</div>

@if (confirmDelete()) {
  <div class="dialog-overlay" (click)="confirmDelete.set(false)">
    <div class="dialog-box" (click)="$event.stopPropagation()">
      <h3>Delete your account?</h3>
      <p class="field-hint">This action is permanent. Your profile, listings, and all associated data will be removed.</p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" (click)="confirmDelete.set(false)">Cancel</button>
        <button class="btn btn-primary" style="background:#dc2626;border-color:#dc2626;" [disabled]="deleting()" (click)="deleteAccount()">
          {{ deleting() ? 'Deleting…' : 'Delete my account' }}
        </button>
      </div>
    </div>
  </div>
}
